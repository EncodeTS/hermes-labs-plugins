[project]
name = "hermes-workflow-record"
version = "0.1.0"
description = "hermes record: demonstrate a browser workflow once, replay it as a Hermes skill"
requires-python = ">=3.11"
# CDP client for the live recorder. Hermes core already ships websockets 15.x;
# declared so the installer and CI resolve it explicitly.
dependencies = [
  "websockets>=15,<16",
]
